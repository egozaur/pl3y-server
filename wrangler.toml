# Wspólny serwer gier PL3Y (Mafia + Tajniacy + Milion + Rozejrzyj się + Kurczacze Imperium + Wordle + Bulgot). Kod mieszka w repo pl3y-server (ten folder).
name = "pl3y-server"
main = "src/index.js"
compatibility_date = "2025-09-01"

[vars]
# Strony, z których wolno łączyć się z serwerem gry.
ALLOWED_ORIGINS = "https://pl3y.pl,https://www.pl3y.pl,https://egozaur.github.io"
# "true" pozwala łączyć się ze stron http://localhost:… bez tokena testowego (tylko lokalny wrangler dev).
# Na produkcji ma być "false": testy E2E z localhost (?server=prod) wchodzą na token testowy z sekretu PL3Y_TEST_SECRET.
# Origin to nie zabezpieczenie (spoza przeglądarki da się go podać dowolnie); prawdziwą bramką jest token HMAC.
ALLOW_LOCALHOST = "false"
# Bramka autoryzacji: "off" (wyłączona) | "optional" (token sprawdzany, gdy jest) | "required" (bez ważnego tokena 401).
# Sekrety (wrangler secret put): PL3Y_PASSWORD, PL3Y_TOKEN_SECRET, PL3Y_TEST_SECRET. Instrukcja: README.md.
# Opcjonalne: PL3Y_DISCORD_WEBHOOK (powiadomienia o prośbach o reset PIN-u), BG_ADMIN_KEY (odczyt partii wysłanych do analizy w Bulgocie: nagłówek X-Admin-Key; bez niego odczyt wyłączony), PL3Y_WORDLE_SECRET (kolejność słów dnia;
# bez niego używany jest PL3Y_TOKEN_SECRET, więc jego zmiana zmienia też słowa).
AUTH_MODE = "required"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "TJ_ROOMS"
class_name = "TjRoom"

[[durable_objects.bindings]]
name = "TJ_SAVES"
class_name = "TjSaves"

[[durable_objects.bindings]]
name = "ML_ROOMS"
class_name = "MlRoom"

[[durable_objects.bindings]]
name = "ML_SCORES"
class_name = "MlScores"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["TjRoom", "TjSaves"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["MlRoom", "MlScores"]

[[durable_objects.bindings]]
name = "RZ_WORDS"
class_name = "RzWords"

[[migrations]]
tag = "v4"
new_sqlite_classes = ["RzWords"]

[[durable_objects.bindings]]
name = "KI_ROOMS"
class_name = "KiRoom"

[[migrations]]
tag = "v5"
new_sqlite_classes = ["KiRoom"]

[[durable_objects.bindings]]
name = "TJ_DUO"
class_name = "TjDuo"

[[migrations]]
tag = "v6"
new_sqlite_classes = ["TjDuo"]

# Gracze PL3Y (nick + PIN + awatar) i Wordle PL (słowo dnia + ranking).
[[durable_objects.bindings]]
name = "PLAYERS"
class_name = "Players"

[[durable_objects.bindings]]
name = "WD_DAILY"
class_name = "WdDaily"

[[migrations]]
tag = "v7"
new_sqlite_classes = ["Players", "WdDaily"]

# Bulgot (roguelike solo): profil gracza + aktywny run (jeden DO na gracza) i ranking.
[[durable_objects.bindings]]
name = "BG_PLAYERS"
class_name = "BgPlayer"

[[durable_objects.bindings]]
name = "BG_RANKS"
class_name = "BgRanks"

[[migrations]]
tag = "v8"
new_sqlite_classes = ["BgPlayer", "BgRanks"]

[observability]
enabled = true
